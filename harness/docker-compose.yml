services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["healthon_isolated_jwt_validation_dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [isolated]
  auth-migrate:
    image: public.ecr.aws/supabase/gotrue:v2.170.0
    depends_on: {db: {condition: service_healthy}}
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:local-only@db:5432/postgres
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
    command: ["gotrue", "migrate"]
    networks: [isolated]
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.170.0
    depends_on: {auth-migrate: {condition: service_completed_successfully}}
    ports: ["127.0.0.1:55999:9999"]
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:local-only@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:55999
      GOTRUE_API_EXTERNAL_URL: http://127.0.0.1:55999
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?runtime-only-secret-required}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_OPERATOR_TOKEN: ${GOTRUE_OPERATOR_TOKEN:?runtime-only-token-required}
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db: {condition: service_healthy}
      auth: {condition: service_healthy}
    ports: ["127.0.0.1:53000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:local-only@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?runtime-only-secret-required}
      PGRST_JWT_AUD: authenticated
      PGRST_SERVER_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [isolated]
networks:
  isolated:
    name: healthon_isolated_jwt_validation_network
volumes:
  healthon_isolated_jwt_validation_dbdata:
