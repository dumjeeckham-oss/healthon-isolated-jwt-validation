name: HealthON isolated JWT validation (2B-0-FIX2 candidate)
on:
  workflow_dispatch:
    inputs:
      allow_runtime:
        description: Explicit approval for this isolated runtime
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: healthon-phase3-3b-fix2
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: healthon-isolated-jwt-validation-2a
      FILE: harness/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight
        run: python harness/scripts/preflight.py
      - name: Approval gate
        env:
          ALLOW_RUNTIME: ${{ inputs.allow_runtime }}
        run: |
          test "$ALLOW_RUNTIME" = "true" || {
            echo 'RUNTIME APPROVAL REQUIRED'
            exit 2
          }
      - name: Generate runtime-only secrets
        run: |
          set -euo pipefail
          set +x
          JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test -n "$JWT_SECRET"
          echo "::add-mask::$JWT_SECRET"
          GOTRUE_OPERATOR_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          test -n "$GOTRUE_OPERATOR_TOKEN"
          echo "::add-mask::$GOTRUE_OPERATOR_TOKEN"
          USER_A_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          test -n "$USER_A_PASSWORD"
          echo "::add-mask::$USER_A_PASSWORD"
          USER_B_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          test -n "$USER_B_PASSWORD"
          echo "::add-mask::$USER_B_PASSWORD"
          test "$USER_A_PASSWORD" != "$USER_B_PASSWORD"
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'GOTRUE_OPERATOR_TOKEN=%s\n' "$GOTRUE_OPERATOR_TOKEN"
            printf 'USER_A_PASSWORD=%s\n' "$USER_A_PASSWORD"
            printf 'USER_B_PASSWORD=%s\n' "$USER_B_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Mark isolated runtime attempt
        run: echo 'RUNTIME_ATTEMPTED=true' >> "$GITHUB_ENV"
      - name: Compose config and start
        run: |
          set -euo pipefail
          docker compose -p "$PROJECT" -f "$FILE" config --quiet
          set +e
          docker compose -p "$PROJECT" -f "$FILE" up -d --wait
          compose_rc=$?
          set -e
          if [ "$compose_rc" -ne 0 ]; then
            case "$compose_rc" in
              ''|*[!0-9]*) echo 'COMPOSE_EXIT_CODE_UNAVAILABLE'; exit 1 ;;
            esac
            echo 'COMPOSE_START_FAILED'
            printf 'COMPOSE_EXIT_CODE=%s\n' "$compose_rc"
            echo 'AUTH_MIGRATE_DIAGNOSTIC_RESTRICTED'
            exit "$compose_rc"
          fi
          echo 'RUNTIME_STARTED=true' >> "$GITHUB_ENV"
      - name: Apply bootstrap and baseline function
        run: |
          docker compose -p "$PROJECT" -f "$FILE" exec -T db psql --set ON_ERROR_STOP=1 -U postgres -d postgres < fixtures/bootstrap.sql
          docker compose -p "$PROJECT" -f "$FILE" exec -T db psql --set ON_ERROR_STOP=1 -U postgres -d postgres < fixtures/before.sql
      - name: Bootstrap users
        env:
          AUTH_URL: http://127.0.0.1:55999
          USER_A_EMAIL: user-a@example.invalid
          USER_B_EMAIL: user-b@example.invalid
        run: python harness/scripts/bootstrap_users.py
      - name: Before JWT test
        env:
          AUTH_URL: http://127.0.0.1:55999
          REST_URL: http://127.0.0.1:53000
          TEST_PHASE: before
          USER_A_EMAIL: user-a@example.invalid
          USER_B_EMAIL: user-b@example.invalid
        run: python tests/test_real_jwt_rpc.py
      - name: Reset and assert clean state
        run: docker compose -p "$PROJECT" -f "$FILE" exec -T db psql --set ON_ERROR_STOP=1 -U postgres -d postgres < fixtures/reset.sql
      - name: Apply patched function
        run: docker compose -p "$PROJECT" -f "$FILE" exec -T db psql --set ON_ERROR_STOP=1 -U postgres -d postgres < fixtures/after.sql
      - name: After JWT test
        env:
          AUTH_URL: http://127.0.0.1:55999
          REST_URL: http://127.0.0.1:53000
          TEST_PHASE: after
          USER_A_EMAIL: user-a@example.invalid
          USER_B_EMAIL: user-b@example.invalid
        run: python tests/test_real_jwt_rpc.py
      - name: Cleanup isolated project only
        if: ${{ always() && env.RUNTIME_ATTEMPTED == 'true' }}
        run: docker compose -p "$PROJECT" -f "$FILE" down --volumes --remove-orphans
